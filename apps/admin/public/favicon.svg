<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- DNA helix left arm -->
  <path d="M10 50 C10 30, 30 20, 38 50 C30 80, 10 70, 10 50Z" fill="none" stroke="#1a5fa8" stroke-width="5" stroke-linecap="round"/>
  <!-- DNA helix right arm -->
  <path d="M90 50 C90 30, 70 20, 62 50 C70 80, 90 70, 90 50Z" fill="none" stroke="#5ab4e0" stroke-width="5" stroke-linecap="round"/>
  <!-- Atom orbit 1 -->
  <ellipse cx="50" cy="50" rx="18" ry="8" fill="none" stroke="#1a5fa8" stroke-width="3"/>
  <!-- Atom orbit 2 -->
  <ellipse cx="50" cy="50" rx="18" ry="8" fill="none" stroke="#3a8fc4" stroke-width="3" transform="rotate(60 50 50)"/>
  <!-- Atom orbit 3 -->
  <ellipse cx="50" cy="50" rx="18" ry="8" fill="none" stroke="#5ab4e0" stroke-width="3" transform="rotate(120 50 50)"/>
  <!-- Atom nucleus -->
  <circle cx="50" cy="50" r="7" fill="url(#nucleusGrad)"/>
  <!-- Electron dots -->
  <circle cx="68" cy="50" r="3" fill="#5ab4e0"/>
  <circle cx="59" cy="35" r="3" fill="#3a8fc4"/>
  <circle cx="41" cy="35" r="3" fill="#1a5fa8"/>
  <circle cx="32" cy="50" r="3" fill="#5ab4e0"/>
  <defs>
    <radialGradient id="nucleusGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#7fd3f5"/>
      <stop offset="100%" stop-color="#1a5fa8"/>
    </radialGradient>
  </defs>
</svg>
